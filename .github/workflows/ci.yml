name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0" wheel
          # pip-audit is installed in a separate venv below. Installing it here
          # pulls filelock into the environment being audited.
          python -m pip install -e ".[all]" "pytest>=8.0.0" "pytest-cov>=5.0.0" "build>=1.2.0" "twine>=5.0.0"

      - name: Run tests
        run: pytest

      - name: Security audit
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip" install --upgrade pip "pip-audit>=2.7.0"
          mapfile -t sites < <(python -c 'import site; print("\n".join(site.getsitepackages()))')
          args=()
          for site_path in "${sites[@]}"; do
            args+=(--path "$site_path")
          done
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --progress-spinner off "${args[@]}"

      - name: Build package
        run: |
          python -m build
          twine check dist/*
