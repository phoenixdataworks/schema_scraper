name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0" wheel
          python -m pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest

      - name: Security audit
        run: pip-audit

      - name: Build package
        run: |
          python -m build
          twine check dist/*
